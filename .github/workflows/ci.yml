name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff format --check . && uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest -q -m "not needs_models"

  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode.app && swift --version
      - run: cd swift && swift build && swift test

  no-ai-endpoints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check_no_ai_endpoints.sh
